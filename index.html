<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#211b3c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Call & Time">
    <title>Call & Time | Office desk</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./app-icon-192.png">
    <link rel="stylesheet" href="styles.css">
    <meta name="referrer" content="no-referrer">
    <script src="app.js?v=8" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#" data-nav="overview" aria-label="Call and Time overview">
          <span class="brand-mark"><img src="assets/call-time-logo.png" alt=""></span>
          <span><strong>Call & Time</strong><small>Office desk</small></span>
        </a>
        <div class="sidebar-label">WORKSPACE</div>
        <nav class="primary-nav" aria-label="Main navigation">
          <button class="nav-item active" type="button" data-nav="overview"><span class="nav-icon">⌂</span>Overview</button>
          <button class="nav-item" type="button" data-nav="calls"><span class="nav-icon">↗</span>Call log</button>
          <button class="nav-item" type="button" data-nav="attendance"><span class="nav-icon">◷</span>Attendance</button>
          <button class="nav-item" type="button" data-nav="meetings"><span class="nav-icon">▦</span>Meetings</button>
          <button class="nav-item" type="button" data-nav="directory"><span class="nav-icon">♧</span>Directory</button>
          <button class="nav-item" type="button" data-nav="call-report"><span class="nav-icon">▤</span>Weekly calls</button>
          <button class="nav-item" type="button" data-nav="attendance-report"><span class="nav-icon">▤</span>Weekly attendance</button>
        </nav>
        <div class="sidebar-bottom">
          <div class="local-note"><span class="status-dot"></span><span><strong>Saved on this device</strong><small>Your entries stay in this browser</small></span></div>
          <div class="cloud-note"><span class="status-dot cloud-status-dot"></span><span><strong id="cloud-status">Device only</strong><small id="cloud-detail">Set up a free server account</small></span></div>
          <button class="nav-item" id="cloud-connect" type="button" data-action="cloud-connect"><span class="nav-icon">☁</span>Connect cloud storage</button>
          <button class="nav-item cloud-signout" id="cloud-signout" type="button" data-action="cloud-signout" hidden><span class="nav-icon">↪</span>Sign out of cloud</button>
          <button class="nav-item" type="button" data-action="backup"><span class="nav-icon">⇩</span>Export backup</button>
          <button class="nav-item" type="button" data-action="merge-backup"><span class="nav-icon">⇧</span>Merge backup</button>
          <label class="sr-only" for="merge-file">Choose a Call & Time backup to merge</label>
          <input id="merge-file" type="file" accept="application/json,.json" hidden>
          <label class="nav-item file-label"><span class="nav-icon">⇧</span>Restore backup<input id="restore-file" type="file" accept="application/json,.json" hidden></label>
          <small class="version-note">Call & Time · Local edition</small>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <div class="breadcrumb"><span>Workspace</span><span class="crumb-divider">/</span><strong id="current-section">Overview</strong></div>
          <div class="topbar-right">
            <span class="today-label" id="today-label"></span>
            <button class="btn btn-secondary btn-small install-app-button" id="install-app" type="button" data-action="install-app" hidden>Install app</button>
            <span class="user-avatar" aria-hidden="true">O</span>
          </div>
        </header>
        <div class="content" id="content" tabindex="-1"></div>
      </main>
    </div>
    <div class="modal-root" id="modal-root"></div>
    <div class="toast-region" id="toast-region" aria-live="polite"></div>
  </body>
</html>
